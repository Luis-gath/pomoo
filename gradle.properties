android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Increase memory for Gradle to avoid Java Heap Space error
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# El proyecto necesita JDK 17 o superior (lo exigen AGP 8.7 y Gradle 9).
#
# La RUTA del JDK no se pone aquí a propósito: es distinta en cada equipo y, si se
# versiona, el build falla en cualquier máquina donde Android Studio esté instalado en
# otro sitio. Android Studio la resuelve solo; para compilar desde la terminal, define
# org.gradle.java.home en tu ~/.gradle/gradle.properties (fuera del repositorio).
